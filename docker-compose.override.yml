      - /workspace/node_modules
      - /workspace/libs/shared-types/node_modules
      - /workspace/libs/nest-common/node_modules
      - /workspace/services/venue-service/node_modules
      - /workspace/services/venue-service/dist
    command: ["sh", "-c", "pnpm --filter @ceylon/shared-types build && pnpm --filter @ceylon/nest-common build && pnpm --filter @ceylon/venue-service dev"]

  event-service:
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/libs/shared-types/node_modules
      - /workspace/libs/nest-common/node_modules
      - /workspace/services/event-service/node_modules
      - /workspace/services/event-service/dist
    command: ["sh", "-c", "pnpm --filter @ceylon/shared-types build && pnpm --filter @ceylon/nest-common build && pnpm --filter @ceylon/event-service dev"]

  order-service:
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/libs/shared-types/node_modules
      - /workspace/libs/nest-common/node_modules
      - /workspace/services/order-service/node_modules
      - /workspace/services/order-service/dist
    command: ["sh", "-c", "pnpm --filter @ceylon/shared-types build && pnpm --filter @ceylon/nest-common build && pnpm --filter @ceylon/order-service dev"]

  api-gateway:
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/libs/shared-types/node_modules
      - /workspace/libs/nest-common/node_modules
