      ORDER_SERVICE_URL: http://order-service:3000
      FOOD_ORDER_SERVICE_URL: http://food-order-service:3000
      RATINGS_SERVICE_URL: http://ratings-service:3000
      RESTAURANT_SERVICE_URL: http://restaurant-service:3000
